[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchos-agent"
version = "0.1.0"
description = "A recoverable and verifiable multi-agent deep research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.scripts]
researchos = "researchos.cli:main"

[project.optional-dependencies]
llm = ["httpx>=0.28.1,<1.0"]
search = ["httpx>=0.28.1,<1.0"]
browser = [
    "httpx>=0.28.1,<1.0",
    "trafilatura>=2.2,<3.0",
]
retrieval = [
    "httpx>=0.28.1,<1.0",
    "pymilvus==2.6.14",
]
observability = [
    "httpx>=0.28.1,<1.0",
    "opentelemetry-proto>=1.36,<2.0",
]
browser-js = ["playwright>=1.55,<2.0"]
real = [
    "httpx>=0.28.1,<1.0",
    "trafilatura>=2.2,<3.0",
    "pymilvus==2.6.14",
    "opentelemetry-proto>=1.36,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/researchos"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "requires_real_extra: test instantiates an optional third-party REAL adapter",
    "requires_real_smoke: operator-only test that may make paid REAL provider calls",
]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
